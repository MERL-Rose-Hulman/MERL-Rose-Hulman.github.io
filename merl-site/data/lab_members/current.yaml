  - name: "Manuella Kwawu"
    title: "Researcher"
    school: "Columbia University"
    year: "Senior/Y4"
    major: "Mechanical Engineering"
    avatar: "/images/members/ManuellaKwawu.png"
    bio: "Manuella is a Ghanaian senior Mechanical Engineering student at Columbia University with a special interest in Robotics. She aims to contribute to the development of field robots that improve daily life, especially in developing countries. At Columbia’s Robotics Manipulation and Mobility Lab, she has worked on designing and prototyping a force-sensing four-bar linkage transmission for potential impedance and admittance control in robot hands. Outside Robotics research, Manuella enjoys teaching and has been an undergraduate teaching assistant for 2 years for courses like Linear Algebra, Ordinary Differential Equations & Thermodynamics. She also co-leads Columbia University’s Engineers Without Borders chapter, working on a preschool construction project in Ghana. Outside of work, Manuella enjoys the outdoors, exploring museums and different cultures."
    linkedin: "https://www.linkedin.com/in/mkwawu/"
